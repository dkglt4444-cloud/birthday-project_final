    /* ═══════════════════════════════════════════
       CINEMATIC TULIP BLOOM SEQUENCE
       Step 0: show bud (instant)
       Step 1: stem grows upward          (0ms)
       Step 2: leaves appear              (+900ms)
       Step 3: petals unfold staggered    (+1400ms)
       Step 4: glow pulse + light ray     (+2000ms)
       Step 5: idle sway + petal drift    (+2600ms)
    ═══════════════════════════════════════════ */
    const tulipEl = document.getElementById('tulip');
    const sparksCvs = document.getElementById('tulip-sparks');
    let bloomed = false;

    function bloomTulip() {
      if (bloomed) return;
      bloomed = true;

      /* Step 0 — reveal closed bud immediately */
      tulipEl.classList.add('bud-ready');

      /* Step 1 — stem grows */
      requestAnimationFrame(() => {
        tulipEl.classList.add('stem-grow');
      });

      /* Step 2 — leaves unfold */
      setTimeout(() => tulipEl.classList.add('leaves-in'), 900);

      /* Step 3 — petals open (staggered via CSS) */
      setTimeout(() => {
        tulipEl.classList.add('bloom-open');
        tulipEl.classList.add('bloomed');   /* triggers glow filter upgrade */
      }, 1400);

      /* Step 4 — radial glow + light ray */
      setTimeout(() => {
        tulipEl.classList.add('glow-pulse');
        spawnTulipSparks();
      }, 2000);

      /* Step 5 — idle sway + floating petals */
      setTimeout(() => {
        tulipEl.classList.add('sway-idle');
        spawnFloatingPetals();
      }, 2600);
    }

    /* Floating petal drift particles */
    function spawnFloatingPetals() {
      const colors = ['#f9a8d4','#fce7f3','#f472b6','#fbcfe8','#ffd6e8'];
      const count = 6;
      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'petal-drift';
        const size = 5 + Math.random() * 7;
        const dx = (Math.random() - 0.5) * 70;
        const dy = -40 - Math.random() * 60;
        const dr = (Math.random() - 0.5) * 60;
        const dur = 3.5 + Math.random() * 2;
        const delay = i * 0.45 + Math.random() * 0.3;
        p.style.cssText = `
          width:${size}px; height:${size}px;
          background:${colors[i % colors.length]};
          left:calc(50% + ${(Math.random()-0.5)*30}px);
          top:30%;
          --pdx:${dx}px; --pdy:${dy}px; --pdr:${dr}deg;
          --pd:${dur}s; --pdelay:${delay}s;
          box-shadow:0 0 4px rgba(244,114,182,0.4);
        `;
        tulipEl.appendChild(p);
        setTimeout(() => p.remove(), (dur + delay + 0.5) * 1000);
      }
    }

    function spawnTulipSparks() {
      const cvs = sparksCvs;
      const ctx = cvs.getContext('2d');

      /* Size canvas to its CSS display size at device resolution */
      const rect = cvs.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      cvs.width = rect.width * dpr;
      cvs.height = rect.height * dpr;
      ctx.scale(dpr, dpr);

      const W = rect.width;
      const H = rect.height;
      const cx = W * 0.50;   /* bloom center x */
      const cy = H * 0.28;   /* bloom center y (upper area) */

      const COLS = ['#ffd6e8', '#f9a8d4', '#fbbf24', '#ffffff',
        '#f472b6', '#e879f9', '#a78bfa', '#fbcfe8'];

      /* Build particles — mix of circles, diamonds, and tiny stars */
      const particles = [];
      const N = 28;
      for (let i = 0; i < N; i++) {
        const angle = (Math.PI * 2 * i / N) + (Math.random() - 0.5) * 0.5;
        const speed = 1.0 + Math.random() * 2.6;
        particles.push({
          x: cx, y: cy,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1.8,   /* slight upward bias */
          r: 1.4 + Math.random() * 2.6,
          col: COLS[Math.floor(Math.random() * COLS.length)],
          life: 1,
          decay: 0.018 + Math.random() * 0.016,
          rot: Math.random() * Math.PI * 2,
          rs: (Math.random() - 0.5) * 0.18,
          type: i % 3,  /* 0=circle, 1=diamond, 2=cross */
        });
      }

      cvs.classList.add('active');

      function drawDiamond(ctx, x, y, r) {
        ctx.beginPath();
        ctx.moveTo(x, y - r);
        ctx.lineTo(x + r * 0.6, y);
        ctx.lineTo(x, y + r);
        ctx.lineTo(x - r * 0.6, y);
        ctx.closePath();
        ctx.fill();
      }

      function drawCross(ctx, x, y, r) {
        ctx.beginPath();
        const arm = r * 1.2, thin = r * 0.32;
        ctx.rect(x - thin, y - arm, thin * 2, arm * 2);
        ctx.rect(x - arm, y - thin, arm * 2, thin * 2);
        ctx.fill();
      }

      let rafId;
      (function loop() {
        ctx.clearRect(0, 0, W, H);
        let alive = false;

        for (const p of particles) {
          p.life -= p.decay;
          p.vy += 0.07;          /* gravity */
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.rs;
          p.vx *= 0.98;          /* air resistance */

          if (p.life <= 0) continue;
          alive = true;

          ctx.save();
          ctx.globalAlpha = Math.max(0, p.life);
          ctx.fillStyle = p.col;
          ctx.shadowColor = p.col;
          ctx.shadowBlur = 8;
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);

          if (p.type === 0) { ctx.beginPath(); ctx.arc(0, 0, p.r, 0, Math.PI * 2); ctx.fill(); }
          else if (p.type === 1) drawDiamond(ctx, 0, 0, p.r * 1.1);
          else drawCross(ctx, 0, 0, p.r * 0.9);

          ctx.restore();
        }

        if (alive) {
          rafId = requestAnimationFrame(loop);
        } else {
          cvs.classList.remove('active');
          cancelAnimationFrame(rafId);
        }
      })();
    }

    /* ── Balloon Pop Mini-Game ── */
    (function runBalloonGame() {
      const arena = document.getElementById('balloon-arena');
      const prompt = document.getElementById('balloon-prompt');
      const counter = document.getElementById('balloon-counter');
      const TOTAL = 6;
      let popped = 0;
      let gameOver = false;

      /* Balloon color palettes — soft gradients */
      const PALETTES = [
        'linear-gradient(145deg, #f9a8d4 0%, #ec4899 50%, #be185d 100%)',
        'linear-gradient(145deg, #e9d5ff 0%, #a855f7 50%, #7c3aed 100%)',
        'linear-gradient(145deg, #fecdd3 0%, #fb7185 50%, #e11d48 100%)',
        'linear-gradient(145deg, #fde68a 0%, #f59e0b 50%, #d97706 100%)',
        'linear-gradient(145deg, #fbcfe8 0%, #f472b6 50%, #db2777 100%)',
        'linear-gradient(145deg, #ddd6fe 0%, #8b5cf6 50%, #6d28d9 100%)',
      ];

      const KNOT_COLORS = [
        '#be185d', '#7c3aed', '#e11d48', '#d97706', '#db2777', '#6d28d9'
      ];

      const SPARK_COLORS = [
        '#ffd6e8', '#f9a8d4', '#fbbf24', '#ffffff',
        '#f472b6', '#e879f9', '#a78bfa', '#fbcfe8'
      ];

      /* Chime sound */
      function playChime() {
        try {
          const ac = new (window.AudioContext || window.webkitAudioContext)();
          const t = ac.currentTime;
          [523.25, 659.25, 783.99].forEach((f, i) => {
            const o = ac.createOscillator(), g = ac.createGain();
            o.connect(g); g.connect(ac.destination);
            o.type = 'sine'; o.frequency.value = f;
            g.gain.setValueAtTime(0, t + i * 0.12);
            g.gain.linearRampToValueAtTime(0.06, t + i * 0.12 + 0.04);
            g.gain.linearRampToValueAtTime(0, t + i * 0.12 + 0.5);
            o.start(t + i * 0.12); o.stop(t + i * 0.12 + 0.6);
          });
        } catch (e) { /* silent */ }
      }

      /* Pop sound — short bright burst */
      function playPop() {
        try {
          const ac = new (window.AudioContext || window.webkitAudioContext)();
          const t = ac.currentTime;
          const o = ac.createOscillator(), g = ac.createGain();
          const fil = ac.createBiquadFilter();
          o.connect(fil); fil.connect(g); g.connect(ac.destination);
          fil.type = 'lowpass'; fil.frequency.value = 3000;
          o.type = 'sine'; o.frequency.value = 880;
          g.gain.setValueAtTime(0, t);
          g.gain.linearRampToValueAtTime(0.08, t + 0.02);
          g.gain.linearRampToValueAtTime(0, t + 0.08);
          o.start(t); o.stop(t + 0.1);
          /* Higher ping */
          const o2 = ac.createOscillator(), g2 = ac.createGain();
          o2.connect(g2); g2.connect(ac.destination);
          o2.type = 'sine'; o2.frequency.value = 1200;
          g2.gain.setValueAtTime(0, t + 0.02);
          g2.gain.linearRampToValueAtTime(0.05, t + 0.04);
          g2.gain.linearRampToValueAtTime(0, t + 0.1);
          o2.start(t + 0.02); o2.stop(t + 0.12);
        } catch (e) { /* silent */ }
      }

      /* Spawn sparkles at balloon position */
      function spawnSparks(x, y) {
        const N = 8;
        for (let i = 0; i < N; i++) {
          const spark = document.createElement('div');
          spark.className = 'pop-spark';
          const angle = (Math.PI * 2 * i / N) + (Math.random() - 0.5) * 0.6;
          const dist = 30 + Math.random() * 40;
          spark.style.cssText = `
            left: ${x}px; top: ${y}px;
            background: ${SPARK_COLORS[Math.floor(Math.random() * SPARK_COLORS.length)]};
            box-shadow: 0 0 6px currentColor;
            --sx: ${Math.cos(angle) * dist}px;
            --sy: ${Math.sin(angle) * dist}px;
          `;
          arena.appendChild(spark);
          setTimeout(() => spark.remove(), 650);
        }
      }

      /* Handle pop */
      function popBalloon(balloon) {
        if (balloon.classList.contains('popping') || gameOver) return;

        playPop();

        /* Start background music on first interaction */
        if (popped === 0 && window.bgAudio) {
          window.bgAudio.play(0.15, 2500); /* Playful/soft volume for game */
        }

        /* Haptic feedback */
        if (navigator.vibrate) navigator.vibrate(25);

        /* Get center position for sparks */
        const rect = balloon.getBoundingClientRect();
        const arenaRect = arena.getBoundingClientRect();
        const cx = rect.left - arenaRect.left + rect.width / 2;
        const cy = rect.top - arenaRect.top + rect.height * 0.35;

        balloon.classList.add('popping');
        spawnSparks(cx, cy);

        popped++;
        counter.textContent = `${popped} / ${TOTAL}`;

        /* Remove balloon after animation */
        setTimeout(() => {
          balloon.style.display = 'none';
        }, 350);

        /* Check completion */
        if (popped >= TOTAL) {
          gameOver = true;
          setTimeout(finishGame, 400);
        }
      }

      /* Create a single balloon */
      function createBalloon(index) {
        const balloon = document.createElement('div');
        balloon.className = 'balloon';

        /* Random horizontal position (10%–90%) */
        const xPos = 10 + (index / (TOTAL - 1)) * 80 + (Math.random() - 0.5) * 12;
        balloon.style.left = `${xPos}%`;
        balloon.style.transform = 'translateX(-50%)';

        /* Animation timing */
        const dur = 5 + Math.random() * 3;     /* 5–8s float up */
        const delay = index * 0.35 + Math.random() * 0.3;
        const drift = (Math.random() - 0.5) * 60;
        const endRot = (Math.random() - 0.5) * 8;
        const swayAmt = 8 + Math.random() * 12;
        const swayDur = 2.5 + Math.random() * 1.5;

        balloon.style.setProperty('--drift', drift + 'px');
        balloon.style.setProperty('--endrot', endRot + 'deg');
        balloon.style.animation = `balloonRise ${dur}s ${delay}s ease-in-out forwards`;

        /* Inner wrapper for sway */
        const inner = document.createElement('div');
        inner.className = 'balloon-inner';
        inner.style.setProperty('--sway', swayAmt + 'px');
        inner.style.setProperty('--sway-dur', swayDur + 's');

        /* Balloon body */
        const body = document.createElement('div');
        body.className = 'balloon-body';
        body.style.background = PALETTES[index % PALETTES.length];

        /* Knot */
        const knot = document.createElement('div');
        knot.className = 'balloon-knot';
        knot.style.background = KNOT_COLORS[index % KNOT_COLORS.length];

        /* String */
        const string = document.createElement('div');
        string.className = 'balloon-string';

        inner.appendChild(body);
        inner.appendChild(knot);
        inner.appendChild(string);
        balloon.appendChild(inner);

        /* Click/tap to pop */
        balloon.addEventListener('click', (e) => {
          e.stopPropagation();
          popBalloon(balloon);
        });

        balloon.addEventListener('touchend', (e) => {
          e.preventDefault();
          e.stopPropagation();
          popBalloon(balloon);
        }, { passive: false });

        return balloon;
      }

      /* Finish → transition to intro screen */
      function finishGame() {
        prompt.classList.add('done');
        counter.style.opacity = '0';

        playChime();

        /* Small confetti burst */
        if (typeof launchConf === 'function') {
          setTimeout(launchConf, 200);
        }

        /* Fade out game screen → show intro screen */
        setTimeout(() => {
          const gameScreen = document.getElementById('game-screen');
          const introScreen = document.getElementById('intro-screen');

          /* Show intro screen behind the game screen */
          introScreen.classList.add('active');

          /* Fade out game screen */
          gameScreen.classList.add('exit');

          /* Fade audio down for reading intro text */
          if (window.bgAudio) window.bgAudio.fadeTo(0.08, 1500);

          /* Remove game screen after transition, start intro typing */
          setTimeout(() => {
            gameScreen.style.display = 'none';
            runIntroSequence();
          }, 1300);
        }, 500);
      }

      /* Launch the game */
      setTimeout(() => {
        counter.classList.add('show');
        for (let i = 0; i < TOTAL; i++) {
          arena.appendChild(createBalloon(i));
        }
      }, 600);
    })();

    /* ── Intro Screen — Typed Text + Button (Stage 2) ── */
    function runIntroSequence() {
      const introText = document.getElementById('intro-typed');
      const introCursor = document.getElementById('intro-cursor');
      const introBtn = document.getElementById('intro-btn');

      const lines = [
        { text: 'umm....', pause: 500 },
        { text: 'tho suru kre??', pause: 0 }
      ];

      let lineIdx = 0, charIdx = 0, currentText = '';

      function typeIntro() {
        if (lineIdx >= lines.length) {
          /* Typing done — hide cursor, show button */
          setTimeout(() => {
            introCursor.style.display = 'none';
            introBtn.classList.add('show');
          }, 600);
          return;
        }
        const line = lines[lineIdx];
        if (charIdx < line.text.length) {
          currentText += line.text[charIdx];
          introText.textContent = currentText;
          charIdx++;
          setTimeout(typeIntro, 70 + Math.random() * 40);
        } else {
          lineIdx++;
          charIdx = 0;
          if (lineIdx < lines.length) currentText += '\n';
          setTimeout(typeIntro, line.pause);
        }
      }

      /* Start typing after card fades in */
      setTimeout(typeIntro, 600);

      /* Subtle chime on button click */
      function playChime() {
        try {
          const ac = new (window.AudioContext || window.webkitAudioContext)();
          const t = ac.currentTime;
          [523.25, 659.25, 783.99].forEach((f, i) => {
            const o = ac.createOscillator(), g = ac.createGain();
            o.connect(g); g.connect(ac.destination);
            o.type = 'sine'; o.frequency.value = f;
            g.gain.setValueAtTime(0, t + i * 0.15);
            g.gain.linearRampToValueAtTime(0.06, t + i * 0.15 + 0.05);
            g.gain.linearRampToValueAtTime(0, t + i * 0.15 + 0.6);
            o.start(t + i * 0.15); o.stop(t + i * 0.15 + 0.7);
          });
        } catch (e) { /* silent fail */ }
      }

      /* Button click → transition to main site */
      introBtn.addEventListener('click', () => {
        playChime();

        /* Fade audio up for emotional final screen */
        if (window.bgAudio) window.bgAudio.fadeTo(0.25, 3000);

        const intro = document.getElementById('intro-screen');
        intro.classList.add('exit');
        setTimeout(runLoadCinematic, 400);
        setTimeout(() => { intro.style.display = 'none'; }, 1100);
      });
    }

    /* ── Background Audio Controller ── */
    window.bgAudio = {
      el: null,
      fadeInterval: null,
      init() {
        if (!this.el) {
          this.el = document.getElementById('bg-music');
          this.el.volume = 0;
        }
      },
      play(targetVolume = 0.2, fadeTime = 2000) {
        this.init();
        if (this.el.paused) {
          this.el.play().catch(e => console.log('Audio play failed:', e));
          this.fadeTo(targetVolume, fadeTime);
        }
      },
      fadeTo(targetVolume, fadeTime = 2000) {
        this.init();
        if (this.fadeInterval) clearInterval(this.fadeInterval);

        const steps = 20;
        const stepTime = fadeTime / steps;
        const volumeStep = (targetVolume - this.el.volume) / steps;

        this.fadeInterval = setInterval(() => {
          let newVol = this.el.volume + volumeStep;
          if ((volumeStep > 0 && newVol >= targetVolume) ||
            (volumeStep < 0 && newVol <= targetVolume)) {
            newVol = targetVolume;
            clearInterval(this.fadeInterval);
          }
          this.el.volume = Math.max(0, Math.min(1, newVol));
        }, stepTime);
      }
    };

    /* ── Ensure initial images load ── */
    window.addEventListener('load', () => {
      const imgL = document.getElementById('img-l');
      const imgR = document.getElementById('img-r');
      if (imgL && !imgL.naturalWidth) imgL.src = 'images/pic1.jpg';
      if (imgR && !imgR.naturalWidth) imgR.src = 'images/pic6.jpg';
    });
  </script>
</body>
